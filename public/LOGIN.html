<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOALA by Nestle | Login</title>
    <link rel="icon" href="Images/faviconimg.png" type="image/png">
    <link rel="stylesheet" href="LOGIN.css">
</head>
<body>
    <div class="page-shell">
        <section class="left-panel">
            <div class="brand-copy">
                <img src="Images/logo_nobackground.png" alt="Nestle platform logo" class="logo">
                <h1>Collaborate with confidence ! </h1>
                <p class="intro-text">
                    A dedicated workspace built for Nestlé teams and advertising partners to manage campaigns,
                    align on deliverables, and keep communication organized in one secure platform.
                </p>

            </div>
        </section>

        <section class="right-panel">
            <div class="login-box">
                <p class="form-label">Welcome Back</p>
                <h2>Sign In</h2>
                <p class="form-copy">Use your company email address to continue.</p>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="username" placeholder="name@xxnestle.com">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>

                <button id="loginBtn" onclick="login()">Sign In</button>
                <div class="error" id="error"></div>
            </div>
        </section>
    </div>

    <script src="LOGIN.js"></script>
</body>
</html>

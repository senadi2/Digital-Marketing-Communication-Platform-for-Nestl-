<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nestlé Marketing Platform</title>
<link rel="stylesheet" href="MM_Dash.css">
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container">
<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">
<img src="Images/Kv2.png" alt="">
</div>
<ul class="nav">
<li>Home</li>
<li>Agencies</li>
<li>Saved Drafts</li>
</ul>
</div>
<!-- MAIN CONTENT -->
<div class="main">
<!-- TOP BAR -->
<div class="topbar">
<div class="notifications">
<i class="fa-solid fa-bell"></i>
<span class="badge" id="notificationCount">2</span>
</div>
<button class="addAgencyBtn" onclick="openModal()">+ Add New Agency</button>
</div>
<!-- SLIDESHOW -->
<div class="slideshow">
  <div class="slide active">
    <img src="Images/nestle-headquarters-highlight.jpg.webp">
    <div class="caption">Nestlé Headquarters</div>
  </div>
  <div class="slide">
    <img src="Images/nestle family.webp">
    <div class="caption">The Nestlé Family</div>
  </div>
  <div class="slide">
    <img src="Images/kitkat-f1-partnership-highlight.jpg.webp">
    <div class="caption">KitKat F1 Partnership</div>
  </div>
  <div class="slide">
    <img src="Images/nestle factory.webp">
    <div class="caption">Nestlé Factory</div>
  </div>
</div>

<!-- AGENCIES SECTION -->
<h2>Agencies</h2>
<div class="agency-grid" id="agencyList">
</div>
<button class="viewMore">View More</button>
<!-- FOOTER -->
<footer>
Nestlé Digital Marketing Platform | System Version 1.0 | © 2026 Nestlé Sri Lanka
</footer>
</div>
</div>
<!-- MODAL FORM -->
<div class="modal" id="agencyModal">
<div class="modal-content">
<h2>Register New Agency</h2>
<input type="text" placeholder="Agency Name">
<input type="text" placeholder="Contact Person">
<input type="email" placeholder="Email">
<input type="text" placeholder="Username">
<input type="password" placeholder="Password">
<button onclick="closeModal()">Register</button>
</div>
</div>
<script src="MM_Dash.js"></script>
</body>
</html>
